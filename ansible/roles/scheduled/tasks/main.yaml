---
- name: Create LaunchAgents directory
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/Library/LaunchAgents"
    state: directory
    mode: "0755"

- name: Setup ansible-pull schedule
  ansible.builtin.import_tasks: setup_schedule.yaml

- name: Setup log rotation
  ansible.builtin.import_tasks: setup_log.yaml
