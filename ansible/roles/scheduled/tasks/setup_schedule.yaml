---
- name: Check extra_vars.yaml exists
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/.local/etc/extra_vars.yaml"
  register: extra_vars_stat

- name: Deploy ansible-pull LaunchAgent
  ansible.builtin.template:
    src: com.kukv.mac-setup.plist.j2
    dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/com.kukv.mac-setup.plist"
    mode: "0644"
  notify: Reload ansible-pull LaunchAgent

- name: Check ansible-pull LaunchAgent is loaded
  ansible.builtin.command:
    cmd: launchctl list com.kukv.mac-setup
  register: schedule_loaded
  changed_when: false
  failed_when: false

- name: Load ansible-pull LaunchAgent
  ansible.builtin.command:
    cmd: launchctl bootstrap gui/{{ ansible_facts.user_uid }} {{ ansible_facts.user_dir }}/Library/LaunchAgents/com.kukv.mac-setup.plist
  when: schedule_loaded.rc != 0
