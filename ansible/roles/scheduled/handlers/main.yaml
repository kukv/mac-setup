---
- name: Reload ansible-pull LaunchAgent
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ ansible_user_uid }}/com.kukv.mac-setup
  failed_when: false
  changed_when: true
  notify: Load ansible-pull LaunchAgent

- name: Load ansible-pull LaunchAgent
  ansible.builtin.command:
    cmd: launchctl bootstrap gui/{{ ansible_user_uid }} {{ ansible_user_dir }}/Library/LaunchAgents/com.kukv.mac-setup.plist
  changed_when: true

- name: Reload log rotation LaunchAgent
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ ansible_user_uid }}/com.kukv.mac-setup-log-rotation
  failed_when: false
  changed_when: true
  notify: Load log rotation LaunchAgent

- name: Load log rotation LaunchAgent
  ansible.builtin.command:
    cmd: launchctl bootstrap gui/{{ ansible_user_uid }} {{ ansible_user_dir }}/Library/LaunchAgents/com.kukv.mac-setup-log-rotation.plist
  changed_when: true
